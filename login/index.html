<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation | Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar-auth">
        <div id="login-section" class="content-box">
            <img src="img/usuario.png" class="avatar" alt="Logo">
            <h2>Bem-vindo.</h2>
            <p class="player-identity">Olá, <strong id="player-name">Carregando...</strong></p>
            <p class="subtitle">Insira sua senha para prosseguir</p>
            
            <form id="login-form" >
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="SENHA" required>
                </div>

                <div class="actions">
                    <button type="submit" class="btn-primary">Entrar</button>
                    <button type="button" class="btn-secondary" onclick="toggleAuth()">Registrar</button>
                </div>
            </form>
        </div>

        <div id="register-section" class="content-box hidden">
            <img src="img/usuario.png" class="avatar" alt="Logo">
            <h2>Criar Conta.</h2>
            <p class="player-identity">Olá, <strong id="reg-player-name">Carregando...</strong></p>
            <p class="subtitle">Junte-se à nossa comunidade</p>
            
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <input type="email" id="reg-email" placeholder="E-MAIL" required>
                </div>

                <div class="input-group">
                    <input type="password" id="reg-password" placeholder="CRIE UMA SENHA" required>
                </div>

                <div class="actions">
                    <button type="submit" class="btn-primary">Finalizar</button>
                    <button type="button" class="btn-secondary" onclick="toggleAuth()">Voltar ao Login</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
