<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FiveM HUD - Modular</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/velocimetro.css">
    <link rel="stylesheet" href="./css/stats.css">
    <link rel="stylesheet" href="./css/minimap.css">
</head>
<body>
    <div class="minimap-container">
        <div class="minimap-radar">
            <img src="./img/map.png" class="map-image" alt="Mapa">
            <div class="player-marker"></div>
        </div>
    </div>

    <div class="logo-container">
        <img src="./img/logo.png" alt="Logo">
    </div>
    <div class="hud-container">

        <div class="speed-wrap">
            <svg class="rpm-ring" width="160" height="160">
                <circle class="track" cx="80" cy="80" r="70"></circle>
                <circle class="fill" id="rpm-arc" cx="80" cy="80" r="70"></circle>
            </svg>
            
            <div class="speed-info">
                <div class="kmh" id="speed-val">000</div>
                <div class="unit-gear">
                    <span>KM/H</span>
                    <span class="gear-active" id="gear-val">N</span>
                </div>
            </div>

            <div class="vehicle-status">
                <div class="status-item fuel">
                    <svg viewBox="0 0 512 512" class="status-icon">
                        <path fill="currentColor" d="M32 64C14.3 64 0 78.3 0 96V416c0 17.7 14.3 32 32 32H288c17.7 0 32-14.3 32-32V96c0-17.7-14.3-32-32-32H32zM48 128H272V256H48V128zM368 96c-13.3 0-24 10.7-24 24V320c0 30.9 25.1 56 56 56h32c13.3 0 24-10.7 24-24V224h16c17.7 0 32-14.3 32-32V128c0-17.7-14.3-32-32-32H368z"/>
                    </svg>
                    <span id="fuel-val">85%</span>
                </div>

                <div class="status-item health">
                    <svg viewBox="0 0 512 512" class="status-icon">
                        <path fill="currentColor" d="M487.4 315.7l-42.6-42.6c13.8-36.7 5.1-79.6-26.2-110.9c-36.2-36.2-92.3-41.9-134.7-17.1L215.6 213.4l-72.4-72.4L211.5 69.3c24.8-42.4 19.1-98.5-17.1-134.7c-31.3-31.3-74.2-40-110.9-26.2L40.9 65.8C26.9 79.8 26.9 102.5 40.9 116.5l22.4 22.4L14.7 187.5c-19.5 19.5-19.5 51.2 0 70.7l116.6 116.6c19.5 19.5 51.2 19.5 70.7 0l48.6-48.6 22.4 22.4c14 14 36.7 14 50.7 0l42.6-42.6c-13.8 36.7-5.1 79.6 26.2 110.9c36.2 36.2 92.3 41.9 134.7 17.1l-71.7-71.7c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l71.7 71.7c24.8-42.4 19.1-98.5-17.1-134.7c-31.3-31.3-74.2-40-110.9-26.2z"/>
                    </svg>
                    <span id="health-val">100%</span>
                </div>
            </div>
        </div>

        <div class="stats-wrap">
            <div class="stat-item">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <div class="bar-bg"><div class="bar-inner hp"></div></div>
            </div>
            <div class="stat-item">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                <div class="bar-bg"><div class="bar-inner ar"></div></div>
            </div>
            <div class="stat-item">
                <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
                <div class="bar-bg"><div class="bar-inner fd"></div></div>
            </div>
            <div class="stat-item">
                <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
                <div class="bar-bg"><div class="bar-inner wt"></div></div>
            </div>
        </div>
    </div>
    <script src="js/minimap.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/speed.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
